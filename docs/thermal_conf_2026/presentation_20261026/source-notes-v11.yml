style_rule (2026-10-19 本人承認):
  - スライド本文は体言止め・だ／である調の短い文。1項目1事実。
  - 因果・流れは「↓」「→」でつなぐ。用語は「用語：説明」形式。
  - 主語と結果は省かない。逆接「しかし」は問題提起の要所のみ。
  - ノート（読み上げ原稿）はです・ます調のまま。
changes_from_v10:
  slide_2: 本文を矢印つなぎの箇条書きに再構成（高密度化→高温部・動作不良／TSVの定義と熱輸送→配置の工夫で最高温度を下げられる／しかし組合せは膨大）。結論文を「TSV配置を高速に評価し、低温な配置を探す」に短縮。出典注記を2行に短縮（NISTの出典は保持）。ノートに対応文を追加。
  slides_3_5_6_7_8_9_11_12: 本文・注記・結論文のです・ます調を体言止め・だ／である調に変更。数値・主張・図は不変。
slide_2_rev (2026-10-19 本人指示): 本文を本人提示の3文に集約（ICの立体集積による熱問題が課題 ↓ チップ内の熱輸送に影響するTSVの配置の最適化が必要 ↓ TSV配置を高速に評価し、低温な配置を探す）。TSVの正式名は補足行に分離。「最適化」は本人の文言で、動機の記述として使用（結果の主張ではない）。目安0:50→0:45。
