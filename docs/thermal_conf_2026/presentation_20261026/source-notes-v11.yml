style_rule (2026-10-19 本人承認):
  - スライド本文は体言止め・だ／である調の短い文。1項目1事実。
  - 因果・流れは「↓」「→」でつなぐ。用語は「用語：説明」形式。
  - 主語と結果は省かない。逆接「しかし」は問題提起の要所のみ。
  - ノート（読み上げ原稿）はです・ます調のまま。
