main_message: >-
  固定した解析条件の範囲では、4×4 TSV密度マップを入力とするPOD–RBF ROMが
  未知配置の最高温度を0.0950 KのMAEで予測し、FVMで検証すべき低温配置候補の選別に利用できた。
limitations:
  - 生成画像は導入用概念図であり、研究データ、解析モデル、解析結果ではない。
  - 固定した非一様発熱分布、境界条件、TSV径、3層共通配置の範囲。
  - 探索配置の大域最適性を主張しない。
  - 密度解像度間の比較および次元の呪いの回避を実証したとは主張しない。
  - ROMをFVMの完全な代替とは位置付けない。
  - 新規FVM、ROM学習、スイープは実施していない。
  - 本編のみで、補助スライドは含めていない。
